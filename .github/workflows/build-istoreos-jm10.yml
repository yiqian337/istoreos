name: Build iStoreOS for YIJIAHE JM10

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "wyapx/istoreos branch or tag"
        required: true
        default: "istoreos-24.10"
        type: string

permissions:
  contents: read

concurrency:
  group: build-istoreos-jm10
  cancel-in-progress: true

env:
  SOURCE_REPO: https://github.com/wyapx/istoreos.git
  SOURCE_REF: ${{ inputs.source_ref }}
  TZ: Asia/Singapore

jobs:
  build:
    name: Build JM10 firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl \
            ccache device-tree-compiler qemu-utils jq zstd
          sudo apt-get clean

      - name: Clone iStoreOS source
        shell: bash
        run: |
          set -euxo pipefail
          git clone \
            --depth 1 \
            --branch "${SOURCE_REF}" \
            "${SOURCE_REPO}" \
            openwrt
          git -C openwrt log -1 --oneline

      - name: Cache downloaded source archives
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: istoreos-jm10-dl-${{ runner.os }}-${{ inputs.source_ref }}-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            istoreos-jm10-dl-${{ runner.os }}-${{ inputs.source_ref }}-
            istoreos-jm10-dl-${{ runner.os }}-

      - name: Update and install feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure YIJIAHE JM10
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_yijiahe_jm10=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_KERNEL_BUILD_USER="github-actions"
          CONFIG_KERNEL_BUILD_DOMAIN="github.com"
          EOF

          make defconfig

          grep -q '^CONFIG_TARGET_rockchip_armv8_DEVICE_yijiahe_jm10=y$' .config

          echo "===== Selected target ====="
          grep -E '^CONFIG_TARGET_rockchip|^CONFIG_TARGET_rockchip_armv8_DEVICE_yijiahe_jm10' .config || true

          echo "===== Author default JM10 packages ====="
          grep -E 'CONFIG_PACKAGE_(kmod-dsa-mv88e6xxx|kmod-brcmfmac|rkwifi-firmware-ap6275p)' .config || true

      - name: Download source packages
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          make download -j8
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" world || make -j1 V=s world

      - name: Collect firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          TARGET_DIR="bin/targets/rockchip/armv8"
          OUTPUT_DIR="../output"

          test -d "${TARGET_DIR}"
          mkdir -p "${OUTPUT_DIR}"

          find "${TARGET_DIR}" -maxdepth 1 -type f -exec cp -v {} "${OUTPUT_DIR}/" \;
          cp -v .config "${OUTPUT_DIR}/config.build"
          git rev-parse HEAD > "${OUTPUT_DIR}/source-commit.txt"

          SYSUPGRADE="$(find "${OUTPUT_DIR}" -maxdepth 1 -type f \
            -name '*yijiahe_jm10*sysupgrade*.img.gz' -print -quit)"

          if [[ -z "${SYSUPGRADE}" ]]; then
            echo "JM10 sysupgrade image was not generated."
            find "${TARGET_DIR}" -maxdepth 2 -type f -print
            exit 1
          fi

          (
            cd "${OUTPUT_DIR}"
            sha256sum ./* > SHA256SUMS-GITHUB
          )

          ls -lah "${OUTPUT_DIR}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-jm10-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
